<section>
  <h1>Users</h1>

  @if (loading()) {
    <p>Loading users…</p>
  } @else if (error()) {
    <p>
      {{ error() }}
      <button type="button" (click)="load()">Retry</button>
    </p>
  } @else if (users().length === 0) {
    <p>No users yet.</p>
  } @else {
    <ul>
      @for (user of users(); track user.id) {
        <li>{{ user.name }} — {{ user.email }}</li>
      }
    </ul>
  }

  <app-create-user (created)="load()" />
</section>
