<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fetchwise — vanilla JavaScript</title>
  </head>
  <body>
    <h1>Users</h1>
    <pre id="out">Loading…</pre>

    <!-- After publish: https://unpkg.com/@poluru-labs/fetchwise -->
    <script src="../../dist/index.global.js"></script>
    <script>
      const api = fetchwise.createClient({
        baseURL: "https://api.shop.com",
        retry: 2,
      });

      api
        .get("/users")
        .then((users) => {
          document.getElementById("out").textContent = JSON.stringify(users, null, 2);
        })
        .catch((error) => {
          document.getElementById("out").textContent = error.message;
        });
    </script>
  </body>
</html>
